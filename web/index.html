<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07131a">
  <title>康威生命游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="stage-shell" aria-label="生命游戏工作区">
      <div class="stage-column">
        <div class="stage">
          <canvas id="gameCanvas" width="1200" height="800" aria-label="康威生命游戏画布"></canvas>
          <div class="stage-hint">左键绘制 · 右键擦除 · 仅拖拽预设到这里</div>
        </div>
      </div>

      <aside class="control-panel" aria-label="游戏控制与预设">
        <section class="library" aria-label="预设库">
          <div class="library-heading">
            <div class="library-title-row">
              <div>
                <h2>预设库</h2>
                <span>系统预设与自定义预设</span>
              </div>
              <button class="custom-toggle" id="openEditorButton" type="button">＋ 自定义形状</button>
            </div>
            <p class="library-help">拖拽卡片到场地放置，点击卡片不会改变地图。</p>
          </div>
          <div class="preset-library" id="presetLibrary"></div>
        </section>

        <div class="stats-row">
          <div class="stat">
            <span class="stat-label">当前代数</span>
            <strong class="stat-value" id="generationValue">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">存活细胞</span>
            <strong class="stat-value" id="populationValue">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">边界模式</span>
            <strong class="stat-value" id="boundaryValue">环绕</strong>
          </div>
          <div class="speed-control">
            <div class="speed-main-row">
              <label for="speedRange">速度</label>
              <input id="speedRange" type="range" min="1" max="60" value="10">
              <span class="speed-value" id="speedValue">10 步/秒</span>
            </div>
            <div class="speed-adjustments" aria-label="速度微调">
              <button type="button" data-speed-delta="1">＋1</button>
              <button type="button" data-speed-delta="10">＋10</button>
              <button type="button" data-speed-delta="-1">−1</button>
              <button type="button" data-speed-delta="-10">−10</button>
            </div>
          </div>
        </div>

        <div class="actions-row">
          <div class="action-group primary-actions">
            <button id="playButton" class="play-button" type="button">▶ 播放</button>
            <button id="stepButton" type="button">单步</button>
            <button id="clearButton" class="danger-button" type="button">清空</button>
            <button id="randomButton" type="button">随机</button>
          </div>
          <div class="action-group secondary-actions">
            <button id="boundaryButton" class="toggle-button is-active" type="button">边界：环绕</button>
            <button id="gridButton" class="toggle-button is-active" type="button">网格线：开</button>
            <button id="mutationButton" class="toggle-button" type="button">细胞突变：关</button>
          </div>
        </div>

        <p class="key-help"><kbd>Space</kbd> 播放/暂停 · <kbd>N</kbd> 单步 · <kbd>R</kbd> 随机 · <kbd>C</kbd> 清空</p>
      </aside>
    </section>
  </main>

  <div class="modal" id="editorModal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <div class="editor-panel">
      <div class="editor-head">
        <div>
          <h2 id="editorTitle">绘制自定义形状</h2>
          <p>点击或拖拽点亮格子，右键擦除。保存后会自动裁剪外围空白。</p>
        </div>
        <button class="icon-button" id="closeEditorButton" type="button" aria-label="关闭编辑器">×</button>
      </div>
      <div class="editor-stage">
        <canvas id="editorCanvas" width="800" height="600" aria-label="自定义形状编辑画布"></canvas>
      </div>
      <div class="editor-actions">
        <button id="clearEditorButton" type="button">清空编辑区</button>
        <div class="right-actions">
          <button id="cancelEditorButton" type="button">取消</button>
          <button id="saveEditorButton" class="toggle-button is-active" type="button">保存为新预设</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="mutationModal" role="dialog" aria-modal="true" aria-labelledby="mutationTitle">
    <div class="settings-panel">
      <div class="editor-head">
        <div>
          <h2 id="mutationTitle">细胞突变设置</h2>
          <p>播放时每秒抽取指定数量的存活细胞，按概率执行死亡或移动突变。</p>
        </div>
        <button class="icon-button" id="closeMutationButton" type="button" aria-label="关闭突变设置">×</button>
      </div>
      <label class="setting-toggle">
        <input id="mutationEnabled" type="checkbox">
        <span>启用细胞突变</span>
      </label>
      <div class="settings-grid">
        <label>
          <span>每秒抽取数量</span>
          <input id="mutationCount" type="number" min="1" max="1000" step="1">
        </label>
        <label>
          <span>单个细胞突变概率（%）</span>
          <input id="mutationProbability" type="number" min="0" max="100" step="1">
        </label>
        <label>
          <span>死亡比例（%）</span>
          <input id="mutationDeathRatio" type="number" min="0" max="100" step="1">
        </label>
        <label>
          <span>移动比例（%）</span>
          <input id="mutationMoveRatio" type="number" min="0" max="100" step="1">
        </label>
      </div>
      <p class="settings-note">死亡比例和移动比例会自动归一化为 100%。参数会保存在本地，启用状态每次打开游戏时默认关闭。</p>
      <div class="editor-actions">
        <span></span>
        <div class="right-actions">
          <button id="cancelMutationButton" type="button">取消</button>
          <button id="saveMutationButton" class="toggle-button is-active" type="button">保存设置</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/platform.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
